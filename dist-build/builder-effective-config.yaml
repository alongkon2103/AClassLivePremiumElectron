directories:
  output: dist-build
  buildResources: build
appId: com.aclassstore.livepro
productName: AClassLivePro
mac:
  target:
    - target: dmg
      arch:
        - x64
  icon: build/icon.icns
  artifactName: ${productName}_${version}_mac.${ext}
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}_Setup_${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: A Class Live Pro
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: A Class Live Pro
  perMachine: false
  allowElevation: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
publish:
  - provider: github
    owner: alongkon2103
    repo: AClassLivePremiumElectron
    releaseType: release
files:
  - filter:
      - electron/**/*
      - dist/**/*
      - package.json
electronVersion: 28.3.3
