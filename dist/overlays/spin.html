<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background: transparent !important; overflow: hidden; display: flex; align-items: center; justify-content: center; }
:root {
  --bg-panel: linear-gradient(135deg, #0a0a1a 0%, #0d0a1f 100%);
  --border-panel: 1px solid rgba(139,92,246,0.35);
  --rad-panel: 22px;
  --shadow-panel: 0 10px 30px rgba(0,0,0,0.5);
  --font-title: 'Arial Black', Arial, sans-serif;
  --color-title: #fff;
  --bg-badge: rgba(139,92,246,0.14);
  --border-badge: 1px solid rgba(139,92,246,0.4);
  --color-badge: #a78bfa;
  --rad-badge: 20px;
  --bg-track: rgba(0,0,0,0.25);
  --rad-track: 14px;
  --mask-edge: #0a0a1a;
  --border-sel: 2px solid rgba(168,85,247,0.8);
  --shadow-sel: 0 0 20px rgba(168,85,247,0.4);
  --color-arrow: #a78bfa;
  --rad-sel: 12px;
  --bg-card: rgba(14,12,28,0.9);
  --border-card: 1.5px solid rgba(255,255,255,0.06);
  --rad-card: 12px;
  --font-num: 'Arial Black', Arial, sans-serif;
}
body.theme-2 {
  --bg-panel: rgba(255, 255, 255, 0.95);
  --border-panel: 1px solid rgba(0,0,0,0.08);
  --rad-panel: 24px;
  --shadow-panel: 0 16px 40px rgba(0,0,0,0.15);
  --font-title: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --color-title: #1f2937;
  --bg-badge: #f3f4f6;
  --border-badge: 1px solid #e5e7eb;
  --color-badge: #4b5563;
  --rad-badge: 8px;
  --bg-track: #f9fafb;
  --rad-track: 16px;
  --mask-edge: rgba(255,255,255,0.9);
  --border-sel: 3px solid #3b82f6;
  --shadow-sel: 0 4px 12px rgba(59,130,246,0.2);
  --color-arrow: #3b82f6;
  --rad-sel: 14px;
  --bg-card: #ffffff;
  --border-card: 1px solid #f3f4f6;
  --rad-card: 14px;
  --shadow-card: 0 4px 12px rgba(0,0,0,0.04);
  --font-num: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
}
body.theme-3 {
  --bg-panel: #000000;
  --border-panel: 4px solid #39ff14;
  --rad-panel: 0px;
  --shadow-panel: 0 0 20px rgba(57,255,20,0.2);
  --font-title: 'Courier New', Courier, monospace;
  --color-title: #39ff14;
  --bg-badge: #000;
  --border-badge: 2px solid #39ff14;
  --color-badge: #39ff14;
  --rad-badge: 0px;
  --bg-track: #111;
  --rad-track: 0px;
  --mask-edge: #000;
  --border-sel: 4px solid #ff00ff;
  --shadow-sel: 0 0 15px #ff00ff;
  --color-arrow: #ff00ff;
  --rad-sel: 0px;
  --bg-card: #000;
  --border-card: 2px solid #444;
  --rad-card: 0px;
  --font-num: 'Courier New', Courier, monospace;
}
#spin-overlay {
  width: 580px;
  background: var(--bg-panel);
  border: var(--border-panel);
  border-radius: var(--rad-panel);
  box-shadow: var(--shadow-panel);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 18px 20px 20px;
  opacity: 0;
  transform: translateY(12px) scale(0.97);
  pointer-events: none;
  transition: opacity .32s, transform .32s, background .32s, border-color .32s, box-shadow .32s;
}
#spin-overlay.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
#spin-header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
#spin-title { font-family: var(--font-title); font-size: 14px; font-weight: 900; letter-spacing: 3px; color: var(--color-title); text-transform: uppercase; }
#spin-badge { font-family: var(--font-title); font-size: 11px; font-weight: bold; color: var(--color-badge); letter-spacing: 1px; background: var(--bg-badge); border: var(--border-badge); border-radius: var(--rad-badge); padding: 4px 12px; }
#spin-track-wrap { width: 100%; height: 136px; overflow: hidden; position: relative; border-radius: var(--rad-track); background: var(--bg-track); }
#spin-track-wrap::before, #spin-track-wrap::after { content: ''; position: absolute; top: 0; bottom: 0; width: 120px; z-index: 2; pointer-events: none; }
#spin-track-wrap::before { left: 0; background: linear-gradient(to right, var(--mask-edge), transparent); }
#spin-track-wrap::after { right: 0; background: linear-gradient(to left, var(--mask-edge), transparent); }
#spin-selector { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 96px; height: 112px; border: var(--border-sel); border-radius: var(--rad-sel); z-index: 10; pointer-events: none; box-shadow: var(--shadow-sel); }
#spin-selector::before { content: '▼'; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); color: var(--color-arrow); font-size: 11px; }
#spin-selector::after { content: '▲'; position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); color: var(--color-arrow); font-size: 11px; }
#spin-track { display: flex; align-items: center; gap: 10px; padding: 0; position: absolute; top: 50%; left: 0; transform: translateY(-50%) translateX(0); will-change: transform; }
.spin-card { min-width: 96px; height: 112px; border-radius: var(--rad-card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: var(--border-card); background: var(--bg-card); flex-shrink: 0; position: relative; overflow: hidden; }
.spin-card .ci { font-size: 20px; line-height: 1; z-index:1; }
.spin-card .cn { font-family: var(--font-num); font-size: 32px; font-weight: 900; line-height: 1; z-index: 1; }
.spin-card .cl { font-family: var(--font-num); font-size: 10px; font-weight: 900; letter-spacing: 1px; padding: 3px 10px; border-radius: 5px; z-index: 1; }
.spin-card.up .ci, .spin-card.up .cn { color: #a855f7; }
.spin-card.up .cl { background: #6d28d9; color: #fff; }
.spin-card.down .ci, .spin-card.down .cn { color: #ef4444; }
.spin-card.down .cl { background: #991b1b; color: #fff; }
.spin-card.zero .ci, .spin-card.zero .cn { color: #64748b; }
.spin-card.zero .cl { background: #1e293b; color: #94a3b8; }
.spin-card.win-card { transform: scale(1.06); background: rgba(20,12,40,0.97); }
#spin-result { font-family: var(--font-title); font-size: 26px; font-weight: 900; letter-spacing: 2px; min-height: 36px; opacity: 0; transform: scale(0.5) translateY(6px); transition: opacity .38s, transform .38s; }
#spin-result.show { opacity: 1; transform: scale(1) translateY(0); }
#spin-pool-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: 100%; }
.pool-chip { font-family: var(--font-num); font-size: 12px; font-weight: 900; padding: 4px 12px; border-radius: 8px; letter-spacing: 0.5px; opacity: 0.7; }
</style>
</head>
<body>
<div id="spin-overlay">
  <div id="spin-header">
    <div id="spin-title">SPIN WHEEL</div>
    <div id="spin-badge">READY</div>
  </div>
  <div id="spin-pool-row"></div>
  <div style="position:relative;width:100%;">
    <div id="spin-track-wrap">
      <div id="spin-selector"></div>
      <div id="spin-track"></div>
    </div>
  </div>
  <div id="spin-result">—</div>
</div>

<script>
let lastSeq = -1; let isAnim = false; let lastPool = ''; let currentTemplate = -1;

function makeCard(val, winner) {
  const card = document.createElement('div');
  const cls = val > 0 ? 'up' : val < 0 ? 'down' : 'zero';
  card.className = 'spin-card ' + cls + (winner ? ' win-card' : '');
  const icon = document.createElement('div'); icon.className = 'ci'; icon.textContent = val > 0 ? '▲' : val < 0 ? '▼' : '◆';
  const num = document.createElement('div'); num.className = 'cn'; num.textContent = val > 0 ? '+' + val : String(val);
  const lbl = document.createElement('div'); lbl.className = 'cl'; lbl.textContent = val !== 0 ? 'WIN' : 'ZERO';
  card.append(icon, num, lbl); return card;
}

function runReel(result, pool, onDone) {
  const track = document.getElementById('spin-track');
  const resEl = document.getElementById('spin-result');
  const badge = document.getElementById('spin-badge');
  const wrap = document.getElementById('spin-track-wrap');
  track.innerHTML = ''; resEl.classList.remove('show'); resEl.textContent = '—';
  const total = 18; const win = 11; const deck = [];
  for (let i = 0; i < total; i++) deck.push(i === win ? result : pool[Math.floor(Math.random() * pool.length)]);
  deck.forEach(v => track.appendChild(makeCard(v, false)));
  const step = 96 + 10; const centerOffset = (wrap.offsetWidth / 2) - (96 / 2);
  track.style.transition = 'none';
  track.style.transform = `translateY(-50%) translateX(${centerOffset}px)`;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      track.style.transition = 'transform 2.6s cubic-bezier(0.15, 1, 0.3, 1)';
      const finalX = centerOffset - (win * step);
      track.style.transform = `translateY(-50%) translateX(${finalX}px)`;
    });
  });
  setTimeout(() => {
    if (track.children[win]) track.children[win].classList.add('win-card');
    const sign = result > 0 ? '+' : '';
    resEl.className = 'show ' + (result > 0 ? 'res-up' : result < 0 ? 'res-down' : 'res-zero');
    resEl.textContent = sign + result + (result > 0 ? ' ▲ WIN' : result < 0 ? ' ▼ LOSE' : ' — ZERO');
    badge.textContent = 'DONE!';
    setTimeout(() => { if (onDone) onDone(); }, 1100);
  }, 2800);
}

function update(s) {
  if (!s) return;
  const tpl = { 'T1': 1, 'T2': 2, 'T3': 3 }[s.template] || 1;
  if (tpl !== currentTemplate) { currentTemplate = tpl; document.body.className = tpl === 1 ? '' : 'theme-' + tpl; }
  const ov = document.getElementById('spin-overlay');
  const badge = document.getElementById('spin-badge');
  const title = document.getElementById('spin-title');
  const pool = (s.spinChoices || '0').split(',').map(x => parseInt(x.trim(), 10)).filter(x => !isNaN(x));
  if (pool.length === 0) pool.push(0);
  const row = document.getElementById('spin-pool-row'); row.innerHTML = '';
  pool.forEach(v => { const chip = document.createElement('div'); chip.className = 'pool-chip ' + (v > 0 ? 'up' : v < 0 ? 'down' : 'zero'); chip.textContent = (v > 0 ? '+' : '') + v; row.appendChild(chip); });
  const seq = s.spinSeq || 0;
  if (lastSeq === -1) { lastSeq = seq; } else if (seq !== lastSeq && !isAnim) {
    lastSeq = seq; isAnim = true; ov.classList.add('visible'); title.textContent = 'SPINNING...'; badge.textContent = 'GO!';
    runReel(s.spinResult || 0, pool, () => { setTimeout(() => { ov.classList.remove('visible'); badge.textContent = 'READY'; title.textContent = 'SPIN WHEEL'; isAnim = false; }, 2000); });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Sync Systems (SSE for OBS, PostMessage for Preview)
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'UPDATE_SETTINGS') update(e.data.settings);
});
function connectSSE() {
  const es = new EventSource("http://localhost:5555/events", { withCredentials: false });
  es.onmessage = (e) => { try { update(JSON.parse(e.data)); } catch (err) {} };
  es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
}
connectSSE();
</script>
</body>
</html>
