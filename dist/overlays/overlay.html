<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent !important;display:flex;align-items:center;
     justify-content:center;width:100vw;height:100vh;overflow:hidden}
#overlay{display:flex;align-items:center;justify-content:center;
         gap:8px;transition:all 0.3s ease; border-radius: 12px; padding: 20px 40px;}
#label,#wins-text,#sep,#max-text{transition:all 0.2s}
.pulse{animation:pulse 0.35s cubic-bezier(.36,.07,.19,.97)}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.22)}
  70%{transform:scale(0.94)}100%{transform:scale(1)}}
</style></head><body>
<div id="overlay">
  <span id="label"></span>
  <span id="wins-text"></span>
  <span id="sep"></span>
  <span id="max-text"></span>
</div>
<script>
let prev = -1;

function applyStroke(el, color, size) {
  if (size <= 0) { el.style.textShadow = 'none'; return; }
  const s = size, c = color;
  const sh = [];
  for (let dx = -s; dx <= s; dx++) {
    for (let dy = -s; dy <= s; dy++) {
      if (dx === 0 && dy === 0) continue;
      sh.push(`${dx}px ${dy}px 0 ${c}`);
    }
  }
  el.style.textShadow = sh.join(',');
}

function hexToRgb(hex){
  if (!hex) return '0,0,0';
  return `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`
}

function update(s) {
  if (!s) return;
  const overlay  = document.getElementById('overlay');
  const labelEl  = document.getElementById('label');
  const winsEl   = document.getElementById('wins-text');
  const sepEl    = document.getElementById('sep');
  const maxEl    = document.getElementById('max-text');

  // Map camelCase from OverlaySettings
  const ff = s.fontFamily, fs = (s.fontSize || 80) + 'px', fw = s.bold ? 'bold' : 'normal';
  const sc = s.outline?.color || '#000000', ss = s.outline?.enabled ? s.outline.size : 0;

  const opacity = (s.background?.opacity || 0) / 100;
  if (opacity <= 0) {
    overlay.style.background = 'transparent';
  } else if (s.background?.gradient) {
    const dir = 'to right';
    overlay.style.background =
      `linear-gradient(${dir},rgba(${hexToRgb(s.background.color || '#000000')},${opacity}),rgba(${hexToRgb(s.background.color2 || '#1a1a2e')},${opacity}))`;
  } else {
    overlay.style.background = `rgba(${hexToRgb(s.background?.color || '#000000')},${opacity})`;
  }
  
  overlay.style.flexDirection = s.layout === 'vertical' ? 'column' : 'row';

  [labelEl,winsEl,sepEl,maxEl].forEach(el => {
    el.style.fontFamily = ff;
    el.style.fontSize   = fs;
    el.style.fontWeight = fw;
  });

  labelEl.style.display = s.showLabel ? '' : 'none';
  labelEl.textContent = s.label;
  labelEl.style.color = s.colorLabel;
  applyStroke(labelEl, sc, ss);

  winsEl.textContent = s.winCount;
  winsEl.style.color = (s.winCount < 0) ? s.colorNeg : s.colorWin;
  applyStroke(winsEl, sc, ss);

  sepEl.style.display = s.showMax ? '' : 'none';
  sepEl.textContent = '/';
  sepEl.style.color = s.colorLabel;
  applyStroke(sepEl, sc, ss);

  maxEl.style.display = s.showMax ? '' : 'none';
  maxEl.textContent = s.maxWins;
  maxEl.style.color = s.colorLose;
  applyStroke(maxEl, sc, ss);

  if (s.winCount !== prev) {
    winsEl.classList.remove('pulse');
    void winsEl.offsetWidth;
    winsEl.classList.add('pulse');
    prev = s.winCount;
  }
}

// 1. Listen for storage changes (OBS Browser Source)
window.addEventListener('storage', () => {
  const saved = localStorage.getItem('aclass_overlay_settings');
  if (saved) update(JSON.parse(saved));
});

// 2. Listen for messages (React Preview iframe)
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'UPDATE_SETTINGS') {
    update(e.data.settings);
  }
});

// Initial load
const saved = localStorage.getItem('aclass_overlay_settings');
if (saved) update(JSON.parse(saved));

</script></body></html>
