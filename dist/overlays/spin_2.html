<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background: transparent !important;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Arial', sans-serif;
}
#spin-overlay {
  width: 560px;
  background: #111;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 20px 20px 22px;
  opacity: 0;
  transform: translateY(8px) scale(0.98);
  pointer-events: none;
  transition: opacity .28s, transform .28s;
}
#spin-overlay.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: all;
}
#spin-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#spin-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 3px;
  color: #555;
  text-transform: uppercase;
}
#spin-badge {
  font-size: 11px;
  color: #444;
  letter-spacing: 1px;
  background: #1a1a1a;
  border-radius: 20px;
  padding: 3px 12px;
}
#spin-track-wrap {
  width: 100%;
  height: 120px;
  overflow: hidden;
  position: relative;
  border-radius: 12px;
  background: #0a0a0a;
}
#spin-track-wrap::before,
#spin-track-wrap::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 110px;
  z-index: 2;
  pointer-events: none;
}
#spin-track-wrap::before {
  left: 0;
  background: linear-gradient(to right, #0a0a0a, transparent);
}
#spin-track-wrap::after {
  right: 0;
  background: linear-gradient(to left, #0a0a0a, transparent);
}
#spin-selector {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 90px;
  height: 100px;
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  z-index: 10;
  pointer-events: none;
}
#spin-selector::before {
  content: '▾';
  position: absolute;
  top: -15px; left: 50%;
  transform: translateX(-50%);
  color: #333;
  font-size: 12px;
}
#spin-selector::after {
  content: '▴';
  position: absolute;
  bottom: -15px; left: 50%;
  transform: translateX(-50%);
  color: #333;
  font-size: 12px;
}
#spin-track {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0;
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%) translateX(0);
  will-change: transform;
}
.spin-card {
  min-width: 90px;
  height: 100px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: #181818;
  flex-shrink: 0;
  transition: transform .2s, background .2s;
}
.spin-card .ci { font-size: 13px; line-height: 1; color: #333; }
.spin-card .cn {
  font-size: 30px; font-weight: 700; line-height: 1;
  color: #e0e0e0;
}
.spin-card .cl {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: #383838;
}
.spin-card.win-card {
  background: #1e1e1e;
  transform: scale(1.06);
}
.spin-card.win-card .cn { color: #fff; }
.spin-card.win-card .ci { color: #555; }
.spin-card.win-card .cl { color: #555; }
#spin-result {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  min-height: 32px;
  color: #e0e0e0;
  opacity: 0;
  transform: scale(0.7) translateY(4px);
  transition: opacity .35s cubic-bezier(.34,1.56,.64,1),
              transform .35s cubic-bezier(.34,1.56,.64,1);
}
#spin-result.show {
  opacity: 1;
  transform: scale(1) translateY(0);
}
#spin-pool-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
}
.pool-chip {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 11px;
  border-radius: 6px;
  letter-spacing: 0.5px;
  color: #444;
  background: #181818;
}
</style>
</head>
<body>
<div id="spin-overlay">
  <div id="spin-header">
    <div id="spin-title">Spin</div>
    <div id="spin-badge">Ready</div>
  </div>
  <div id="spin-pool-row"></div>
  <div style="position:relative;width:100%;">
    <div id="spin-track-wrap">
      <div id="spin-selector"></div>
      <div id="spin-track"></div>
    </div>
  </div>
  <div id="spin-result">—</div>
</div>

<script>
let lastSeq = -1;
let isAnim  = false;
let lastPool = '';

function makeCard(val, winner) {
  const card = document.createElement('div');
  const cls  = val > 0 ? 'up' : val < 0 ? 'down' : 'zero';
  card.className = 'spin-card ' + cls + (winner ? ' win-card' : '');

  const icon = document.createElement('div');
  icon.className = 'ci';
  icon.textContent = val > 0 ? '▲' : val < 0 ? '▼' : '◆';

  const num = document.createElement('div');
  num.className = 'cn';
  num.textContent = val > 0 ? '+' + val : String(val);

  const lbl = document.createElement('div');
  lbl.className = 'cl';
  lbl.textContent = val !== 0 ? 'WIN' : 'ZERO';

  card.append(icon, num, lbl);
  return card;
}

function buildDeck(result, pool) {
  const total = 18;
  const win   = 11;
  const deck  = [];
  for (let i = 0; i < total; i++) {
    deck.push(i === win ? result : pool[Math.floor(Math.random() * pool.length)]);
  }
  return { deck, win };
}

function runReel(result, pool, onDone) {
  const track  = document.getElementById('spin-track');
  const resEl  = document.getElementById('spin-result');
  const title  = document.getElementById('spin-title');
  const badge  = document.getElementById('spin-badge');
  const wrap   = document.getElementById('spin-track-wrap');

  track.innerHTML = '';
  resEl.classList.remove('show');
  resEl.textContent = '—';

  const { deck, win } = buildDeck(result, pool);
  deck.forEach(v => track.appendChild(makeCard(v, false)));

  const cardWidth = 90;
  const gap = 8;
  const step = cardWidth + gap;
  const centerOffset = (wrap.offsetWidth / 2) - (cardWidth / 2);

  track.style.transition = 'none';
  track.style.transform  = `translateY(-50%) translateX(${centerOffset}px)`;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      track.style.transition = 'transform 2.6s cubic-bezier(0.15, 1, 0.3, 1)';
      track.style.transform  = `translateY(-50%) translateX(${centerOffset - win * step}px)`;
    });
  });

  setTimeout(() => {
    const targetCard = track.children[win];
    if (targetCard) targetCard.classList.add('win-card');

    const sign = result > 0 ? '+' : '';
    resEl.textContent = sign + result + (result > 0 ? ' ▲' : result < 0 ? ' ▼' : '');
    resEl.classList.add('show');

    title.textContent = result > 0 ? '▲ WIN ' + Math.abs(result) : result < 0 ? '▼ WIN ' + Math.abs(result) : '— ZERO';
    badge.textContent = 'Done';

    setTimeout(() => { if (onDone) onDone(); }, 1100);
  }, 2800);
}

function renderPool(pool) {
  const row = document.getElementById('spin-pool-row');
  const key = pool.join(',');
  if (key === lastPool) return;
  lastPool = key;
  row.innerHTML = '';
  pool.forEach(v => {
    const chip = document.createElement('div');
    chip.className = 'pool-chip';
    chip.textContent = (v > 0 ? '+' : '') + v;
    row.appendChild(chip);
  });
}

function update(s) {
  if (!s) return;
  const ov    = document.getElementById('spin-overlay');
  const badge = document.getElementById('spin-badge');
  const title = document.getElementById('spin-title');

  const raw  = (s.spinChoices || '0').split(',');
  const pool = raw.map(x => parseInt(x.trim(), 10)).filter(x => !isNaN(x));
  if (pool.length === 0) pool.push(0);
  renderPool(pool);

  const seq = s.spinSeq || 0;

  if (lastSeq === -1) {
    lastSeq = seq;
  } else if (seq !== lastSeq && !isAnim) {
    lastSeq = seq;
    isAnim  = true;
    ov.classList.add('visible');
    title.textContent = 'SPIN';
    badge.textContent = 'Go';

    runReel(s.spinResult || 0, pool, () => {
      setTimeout(() => {
        ov.classList.remove('visible');
        badge.textContent = 'Ready';
        title.textContent = 'Spin';
        isAnim = false;
      }, 2000);
    });
  }
}

window.addEventListener('storage', () => {
  const saved = localStorage.getItem('aclass_overlay_settings');
  if (saved) update(JSON.parse(saved));
});

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'UPDATE_SETTINGS') {
    update(e.data.settings);
  }
});

const saved = localStorage.getItem('aclass_overlay_settings');
if (saved) update(JSON.parse(saved));
</script>
</body>
</html>
